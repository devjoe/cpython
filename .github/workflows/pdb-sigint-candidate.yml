name: Pdb SIGINT candidate comparison

on:
  push:
    branches: ['pdb-ctrlc-candidate-validation-20261020']
    paths:
      - 'Lib/pdb.py'
      - 'Lib/test/test_pdb.py'
      - 'Tools/pdb_sigint_validation.py'
      - '.github/workflows/pdb-sigint-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdb-sigint-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'devjoe/cpython' && github.ref == 'refs/heads/pdb-ctrlc-candidate-validation-20261020'
    name: ${{ matrix.os }} / both backends
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - name: Checkout reviewed candidate and tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Bootstrap interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15.0'
          check-latest: false
      - name: Checkout immutable official runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: python/cpython
          ref: 6044c6275dcfcb2f2fc49742920e4cfb094089a4
          path: runtime-source
          persist-credentials: false
          fetch-depth: 1
      - name: Build exact baseline native runtime without system installation
        run: python -I Tools/pdb_sigint_validation.py build
      - name: Compare baseline and candidate with identical tests and native build
        run: python -I Tools/pdb_sigint_validation.py compare
      - name: Preserve runner-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdb-sigint-candidate-${{ matrix.os }}
          path: candidate-results/
          retention-days: 14
          if-no-files-found: warn
